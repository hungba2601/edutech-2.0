
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ hỗ trợ giảng dạy</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/icon.svg">
    <meta name="theme-color" content="#0ea5e9">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        outfit: ['Be Vietnam Pro', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fff9f2;
        }
        /* Sử dụng Be Vietnam Pro cho các tiêu đề để tránh lỗi dấu tiếng Việt */
        .font-outfit {
            font-family: 'Be Vietnam Pro', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .tech-gradient {
            background: linear-gradient(135deg, #0ea5e9 0%, #2dd4bf 100%);
        }
        .text-glow {
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }
        .dark .text-glow {
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }
        
        /* Overlay để chữ dễ đọc và làm mềm nền */
        .wave-container::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 253, 241, 0.2);
            pointer-events: none;
            z-index: 0;
        }
        .dark .wave-container::after {
            background: rgba(2, 6, 23, 0.6);
        }
        
        /* Hiệu ứng chữ chạy - Tối ưu để chạy hết và tốc độ vừa phải */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            background: #fff;
            border-bottom: 1px solid #fee2e2;
            position: relative;
            display: flex;
            align-items: center;
        }
        .marquee-text {
            display: inline-flex;
            align-items: center;
            padding-left: 100%; /* Đẩy nội dung ra khỏi container bên phải */
            animation: marquee-scroll 14s linear infinite; /* Tốc độ vừa phải (14s) để dễ đọc hơn */
            will-change: transform;
        }
        @keyframes marquee-scroll {
            0% { 
                transform: translateX(0); 
            }
            100% { 
                /* Di chuyển toàn bộ chiều dài (bao gồm cả khoảng trống 100% padding) qua trái */
                transform: translateX(-100%); 
            }
        }

        /* Hiệu ứng chuông rung lắc khi có thông báo mới */
        @keyframes bell-ring {
            0%, 100% { transform: rotate(0deg); }
            10% { transform: rotate(14deg); }
            20% { transform: rotate(-14deg); }
            30% { transform: rotate(10deg); }
            40% { transform: rotate(-10deg); }
            50% { transform: rotate(6deg); }
            60% { transform: rotate(-4deg); }
            70% { transform: rotate(2deg); }
            80% { transform: rotate(-1deg); }
            90% { transform: rotate(0deg); }
        }
        @keyframes notification-glow {
            0%, 100% { 
                box-shadow: 0 0 4px rgba(239, 68, 68, 0.4), 0 0 8px rgba(239, 68, 68, 0.2);
                background-color: rgba(239, 68, 68, 0.1);
            }
            50% { 
                box-shadow: 0 0 12px rgba(239, 68, 68, 0.8), 0 0 24px rgba(239, 68, 68, 0.4);
                background-color: rgba(239, 68, 68, 0.25);
            }
        }
        .bell-notify {
            animation: bell-ring 1.2s ease-in-out infinite, notification-glow 1.5s ease-in-out infinite;
        }
        .bell-notify .bell-icon {
            color: #ef4444 !important;
        }

        /* Hiệu ứng nền cao cấp */
        .wave-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #fff9f2;
            background-image: url('/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow: hidden;
            filter: brightness(1.0) contrast(1.0); /* Ảnh mới êm dịu, không cần lọc gắt */
            transition: filter 0.5s ease, background 0.5s ease;
        }

        .dark .wave-container {
            background-color: #020617;
            filter: brightness(0.5) contrast(1.1); /* Chế độ tối cho ảnh mới */
        }

        /* Giữ lại hiệu ứng lượn sóng nhẹ nếu cần, nhưng thay đổi opacity */
        .wave-bg {
            position: absolute;
            width: 200%;
            height: 100%;
            background-repeat: repeat-x;
            background-position: bottom;
            transform: translate3d(0, 0, 0);
            mix-blend-mode: overlay;
            opacity: 0.2;
        }

        .wave-top {
            bottom: 0;
            height: 180px;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" fill="%23ffffff" fill-opacity="0.3"></path></svg>');
            animation: wave-animation 22s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
            z-index: 1;
        }

        .wave-middle {
            bottom: 0;
            height: 220px;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" fill="%23ffffff" fill-opacity="0.2"></path></svg>');
            animation: wave-animation 18s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite reverse;
            z-index: 2;
        }

        .wave-bottom {
            bottom: 0;
            height: 280px;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" fill="%23ffffff" fill-opacity="0.1"></path></svg>');
            animation: wave-animation 26s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
            z-index: 3;
        }

        .dark .wave-top, .dark .wave-middle, .dark .wave-bottom {
            opacity: 0.1;
        }


        @keyframes wave-animation {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
<script type="importmap">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('ServiceWorker registration successful');
            })
            .catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }

</html>
